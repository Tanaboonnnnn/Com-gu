name: Publish release

# Dispatch this at the tag you want released:
#   gh workflow run publish.yml --ref v2.0.2
#
# It builds the candidate itself rather than adopting one from an earlier run, so the
# installers attached to a release are provably the ones produced from that tag by the
# pipeline in that tag's own tree.
on:
  workflow_dispatch:
    inputs:
      npm_only:
        description: Publish only comgu-cli to npm for an already-created GitHub Release
        required: false
        default: false
        type: boolean
      version:
        description: Version to recover when npm_only is true (for example 3.3.1)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # Fail cheap before allocating the five native packaging runners. The final publish step
      # repeats the release-exists check to close the race while the candidate is building.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify security invariants
        run: node scripts/verify-security-invariants.mjs

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Verify release metadata agrees
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const manifest = require('./extension/manifest.json');
          const versionSource = fs.readFileSync('src/main/version.ts', 'utf8');
          const appVersion = versionSource.match(/APP_VERSION = '([^']+)'/)?.[1];
          const versions = [pkg.version, lock.version, lock.packages?.['']?.version, manifest.version, appVersion];
          if (versions.some((version) => version !== pkg.version)) {
            throw new Error(`Release versions disagree: ${versions.join(', ')}`);
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const changelogVersion = changelog.match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1];
          if (changelogVersion !== pkg.version) {
            throw new Error(`Top changelog entry ${changelogVersion ?? '<missing>'} does not match ${pkg.version}`);
          }

          const notesPath = `docs/release-notes/v${pkg.version}.md`;
          if (!fs.existsSync(notesPath)) throw new Error(`Missing ${notesPath}`);
          const notes = fs.readFileSync(notesPath, 'utf8');
          if (!notes.includes(`## ${pkg.version}`)) throw new Error(`${notesPath} has no matching version heading`);
          if (!/unsigned/i.test(notes) || !/unnotarized/i.test(notes)) {
            throw new Error(`${notesPath} must disclose unsigned and unnotarized macOS artifacts`);
          }
          for (const artifact of [
            'ComGu-Setup-x64.exe',
            'ComGu-Setup-arm64.exe',
            'ComGu-macOS-arm64.dmg',
            'ComGu-macOS-arm64.zip',
            'ComGu-Linux-x64.AppImage',
            'ComGu-Linux-x64.deb',
            'ComGu-Linux-arm64.AppImage',
            'ComGu-Linux-arm64.deb',
            'ComGu-CLI-windows-x64.zip',
            'ComGu-CLI-windows-arm64.zip',
            'ComGu-CLI-linux-x64.tar.gz',
            'ComGu-CLI-linux-arm64.tar.gz',
            'ComGu-Extension.zip',
            'install.sh',
            'install.ps1',
            'SHA256SUMS.txt'
          ]) {
            if (!notes.includes(`\`${artifact}\``)) throw new Error(`${notesPath} is missing ${artifact}`);
          }
          NODE

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Refuse an existing release
        run: node scripts/check-release-absent.mjs

  candidate:
    name: Build candidate
    needs: preflight
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_only) }}
    uses: ./.github/workflows/release.yml

  publish:
    name: Publish
    needs: candidate
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # A branch has no version guarantee — release.yml only checks the tag against
      # package.json when the ref is a tag — so a branch must never reach `gh release create`.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      # Release notes are written by hand and reviewed in the tagged tree. Generating
      # them here would mean the release said something nobody read before it shipped.
      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: comgu-candidate-${{ github.run_id }}
          path: publish

      # The checksums were computed on the packaging runner. Re-checking them here proves
      # the bytes about to be attached are the bytes that were smoke-tested.
      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish the release
        run: |
          set -euo pipefail
          node scripts/check-release-absent.mjs
          gh release create "$TAG" \
            publish/ComGu-Setup-x64.exe \
            publish/ComGu-Setup-arm64.exe \
            publish/ComGu-macOS-arm64.dmg \
            publish/ComGu-macOS-arm64.zip \
            publish/ComGu-Linux-x64.AppImage \
            publish/ComGu-Linux-x64.deb \
            publish/ComGu-Linux-arm64.AppImage \
            publish/ComGu-Linux-arm64.deb \
            publish/ComGu-CLI-windows-x64.zip \
            publish/ComGu-CLI-windows-arm64.zip \
            publish/ComGu-CLI-linux-x64.tar.gz \
            publish/ComGu-CLI-linux-arm64.tar.gz \
            publish/ComGu-Extension.zip \
            publish/install.sh \
            publish/install.ps1 \
            publish/SHA256SUMS.txt \
            --title "ComGu ${TAG#v}" \
            --notes-file "docs/release-notes/$TAG.md"
          gh release view "$TAG" --json url --jq .url


  npm-publish:
    name: Publish npm package
    needs: publish
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.npm_only) || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout recovery tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_only }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ format('v{0}', inputs.version) }}

      - name: Checkout release ref
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_only) }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve and verify npm version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.npm_only }}" = "true" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "version is required when npm_only is true" >&2
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          package_version="$(node -p "require('./packages/comgu-cli/package.json').version")"
          if [ "$package_version" != "$VERSION" ]; then
            echo "comgu-cli version $package_version does not match requested $VERSION" >&2
            exit 1
          fi
          gh release view "v$VERSION" >/dev/null
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish comgu-cli to npm with OIDC
        run: |
          set -euo pipefail
          npm install --global 'npm@^11.15.0'
          if npm view "comgu-cli@$VERSION" version >/dev/null 2>&1; then
            echo "comgu-cli@$VERSION is already published; nothing to do."
            exit 0
          fi
          npm publish ./packages/comgu-cli --access public --provenance
